<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="因硕贝贝（EnsureFish）的个人主页：摄影作品、自设展示与联系方式。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="因硕贝贝的官网 | EnsureFish">
  <meta property="og:description" content="至善 · 至美">
  <meta property="og:url" content="https://ensurefish.pages.dev/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- 预连接图片域名 -->
  <link rel="preconnect" href="https://pub-3bb49bb0e4de4bcb941623bccda3b695.r2.dev" crossorigin>
  <!-- 预加载首屏 LCP 图片，提升渲染速度 -->
  <link rel="preload" as="image" href="https://pub-3bb49bb0e4de4bcb941623bccda3b695.r2.dev/Gallery/002.webp" fetchpriority="high">
  <!-- 预加载画廊 JSON 数据，缩短请求链 -->
  <link rel="preload" href="./images.json" as="fetch" crossorigin>
  <title>因硕贝贝的官网 | EnsureFish</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark')
          ? saved : (systemDark ? 'dark' : 'light');
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '#0f1115' : '#ffffff';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="#main" class="skip-link">跳到主要内容</a>

  <header class="top_bar">

        <li><a href="#contact">☎️ <span class="nav-label">联系</span></a></li>
      </ul>
    </nav>
    <button class="theme-toggle" id="themeToggle" type="button"
            aria-label="切换深色模式" title="切换深色模式">
      <span id="themeIcon">🌙</span>
    </button>
  </header>

  <div class="big_card">
    <main id="main">

          <p>我平时会在 <a href="https://space.bilibili.com/3546975999887513" target="_blank" rel="noopener">Bilibili</a>、抖音 上发布视频。</p>
          <p>如果你也喜欢我制作的视频，欢迎 <a href="#contact">加入我们</a>！</p>
        </div>
        <div class="hero-image">
          <!-- 你可以换成专门的头像，这里用自设图作为演示 -->
          <img src="https://pub-3bb49bb0e4de4bcb941623bccda3b695.r2.dev/Gallery/002.webp" alt="因硕贝贝的自设形象">
        </div>
      </section>

      <!-- 画廊 -->
      <section class="section" id="gallery">
        <h2>🌁 画廊</h2>
        <p>这是我拍摄的照片</p>
        <div class="gallery" id="gallery_1"></div>
      </section>

      <!-- 设子 -->
      <section class="section" id="fursona">
        <h2>🪪 设定展示</h2>
        <p>这是我的自设！</p>
        <div class="gallery" id="gallery_2"></div>
      </section>

      <!-- 联系 -->
      <section class="section" id="contact">
        <h2>☎️ 联系我们</h2>
        <p>如果你喜欢我们的作品或对我们的作品有意见或建议，欢迎联系我们！</p>
        <ul class="contact-list">
          <li>🐧 <a href="...">QQ 交流群</a></li>
          <li>🐱 <a href="...">GitHub 仓库</a></li>

    </main>
    
    <footer>
      <p>2026 &copy; 保留所有权利</p>

  <script src="script.js"></script>
</body>
</html>
