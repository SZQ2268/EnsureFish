  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (saved === 'light' || saved === 'dark')
          ? saved
          : (systemDark ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>

  <script>
    (function () {
      var STORAGE_KEY = 'theme';
      var root = document.documentElement;
      var mql = window.matchMedia('(prefers-color-scheme: dark)');
      var btn = document.getElementById('themeToggle');
      var icon = document.getElementById('themeIcon');

      function getSaved() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
      }

      function setSaved(value) {
        try {
          if (value === null) localStorage.removeItem(STORAGE_KEY);
          else localStorage.setItem(STORAGE_KEY, value);
        } catch (e) {}
      }

      // mode: 'light' | 'dark' | 'system'
      function apply(mode) {
        var resolved = mode === 'system'
          ? (mql.matches ? 'dark' : 'light')
          : mode;

        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;

        // 同步浏览器地址栏/状态栏颜色
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = resolved === 'dark' ? '#0f1115' : '#ffffff';

        if (icon) icon.textContent = resolved === 'dark' ? '☀️' : '🌙';
        if (btn) {
          btn.setAttribute('aria-label',
            resolved === 'dark' ? '切换到浅色模式' : '切换到深色模式');
        }
      }

      // 按钮：在 亮 / 暗 之间切换（写入 localStorage，覆盖系统设置）
      if (btn) {
        btn.addEventListener('click', function () {
          var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
          setSaved(next);
          apply(next);
        });
      }

      // 用户没手动选过时，跟随系统变化实时切换
      mql.addEventListener('change', function () {
        if (!getSaved()) apply('system');
      });

      // 页面加载时同步一次（内联脚本已设好，这里只是补齐按钮图标等）
      apply(getSaved() || 'system');
    })();
  </script>
  <script>
    function renderImages(box, list) {
      if (!box) return;
        if (!Array.isArray(list) || list.length === 0) {
        box.textContent = '暂时没有图片';
        return;
      }
      box.innerHTML = list.map(function (url) {
        return '<img src="' + url + '" alt="" loading="lazy">';
      }).join('');
    }

    fetch('./images.json')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        renderImages(document.getElementById('gallery_1'), data.gallery);
        renderImages(document.getElementById('gallery_2'), data.fursona);
      })
      .catch(function (err) {
        console.error('加载失败：', err);
      });
  </script>
